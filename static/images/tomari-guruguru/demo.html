<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치비 서소영 ぐるぐる 데모</title>
<style>
  :root{ --ink:#1d1d1f; --sub:#6e6e73; --line:#e8e8ed; --accent:#5b9bd5; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
  .tg{max-width:560px;margin:0 auto}
  #stage{
    position:relative;height:min(78vw,460px);display:flex;align-items:center;justify-content:center;
    background:#FFF8EE;border-radius:20px;overflow:hidden;cursor:crosshair;
    touch-action:none;-webkit-user-select:none;user-select:none;border:1px solid var(--line);
  }
  #char{width:440px;height:440px;background-repeat:no-repeat;background-size:500% 500%;
    mix-blend-mode:multiply;will-change:background-position,background-image;}
  #hint{position:absolute;top:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--sub);pointer-events:none}
  .controls{padding:16px 4px 4px;display:flex;flex-direction:column;gap:14px;touch-action:auto}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row .lbl{font-size:12px;font-weight:600;color:var(--sub);min-width:52px}
  button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:980px;padding:8px 15px;cursor:pointer;transition:all .15s}
  button:hover{background:#f5f5f7}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
  .sw.on{box-shadow:0 0 0 2px var(--accent)}
  input[type=range]{flex:1;max-width:220px;accent-color:var(--accent)}
  .status{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="tg">
  <div id="stage">
    <div id="hint">마우스를 움직이거나(모바일은 패널 위 드래그) — 서소영이 그 방향을 봅니다 👀</div>
    <div id="char"></div>
  </div>
  <div class="controls">
    <div class="row">
      <span class="lbl">토크</span>
      <button id="btnDemo">💬 데모 토크</button>
      <button id="btnMic">🎤 마이크</button>
      <span id="micStatus" class="status"></span>
    </div>
    <div class="row">
      <span class="lbl">깜빡임</span>
      <button id="btnBlink" class="on">자동 깜빡임 ON</button>
      <span class="lbl" style="margin-left:6px">크기</span>
      <input id="size" type="range" min="200" max="560" value="560">
    </div>
    <div class="row">
      <span class="lbl">배경</span>
      <button class="sw on" data-bg="#FFF8EE" style="background:#FFF8EE"></button>
      <button class="sw" data-bg="#FFFFFF" style="background:#FFFFFF"></button>
      <button class="sw" data-bg="#FDEFEF" style="background:#FDEFEF"></button>
      <button class="sw" data-bg="#EEF4FB" style="background:#EEF4FB"></button>
      <span class="status" id="cellStatus" style="margin-left:auto"></span>
    </div>
  </div>
</div>
<script>
(function(){
  const BASE="/images/tomari-guruguru/frames/";
  const SHEETS={A:BASE+"A.png",B:BASE+"B.png",C:BASE+"C.png",D:BASE+"D.png"};
  Object.values(SHEETS).forEach(u=>{const i=new Image();i.src=u;});
  const char=document.getElementById('char'), stage=document.getElementById('stage');
  const cellStatus=document.getElementById('cellStatus');
  const ROWS=5,COLS=5;
  const pos=(r,c)=>(c*25)+"% "+(r*25)+"%";
  let range=340,smoothing=0.28;
  const target={x:0,y:0},cur={x:0,y:0};
  let blink=false,mouth=0,autoBlink=true;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  function updateFromXY(x,y){
    const r=char.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height*0.42;
    target.x=clamp((x-cx)/range,-1,1); target.y=clamp((y-cy)/range,-1,1);
  }
  window.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')updateFromXY(e.clientX,e.clientY);});
  function touchHandler(e){const t=e.touches[0];if(!t)return;e.preventDefault();updateFromXY(t.clientX,t.clientY);}
  stage.addEventListener('touchstart',touchHandler,{passive:false});
  stage.addEventListener('touchmove',touchHandler,{passive:false});
  let lastR=2,lastC=2;
  function render(){
    const s=blink?'D':(mouth===0?'A':(mouth===1?'B':'C'));
    char.style.backgroundImage="url('"+SHEETS[s]+"')";
    char.style.backgroundPosition=pos(lastR,lastC);
  }
  function tick(){
    cur.x+=(target.x-cur.x)*smoothing; cur.y+=(target.y-cur.y)*smoothing;
    const c=clamp(Math.round((cur.x+1)/2*(COLS-1)),0,COLS-1);
    const r=clamp(Math.round((cur.y+1)/2*(ROWS-1)),0,ROWS-1);
    if(c!==lastC||r!==lastR){lastC=c;lastR=r;cellStatus.textContent="셀 r"+r+"c"+c;}
    render(); requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  const rand=(a,b)=>a+Math.random()*(b-a);
  let blinkTimer;
  function blinkOnce(d,after){blink=true;setTimeout(()=>{blink=false;if(after)after();},d);}
  function scheduleBlink(){
    if(!autoBlink)return;
    blinkTimer=setTimeout(()=>{
      const k=Math.random();
      if(k<0.18)blinkOnce(rand(80,120),()=>setTimeout(()=>blinkOnce(rand(70,110),scheduleBlink),rand(90,160)));
      else if(k<0.30)blinkOnce(rand(260,420),scheduleBlink);
      else blinkOnce(rand(90,150),scheduleBlink);
    },rand(1400,4200));
  }
  scheduleBlink();
  document.getElementById('btnBlink').addEventListener('click',function(){
    autoBlink=!autoBlink;this.classList.toggle('on',autoBlink);
    this.textContent=autoBlink?"자동 깜빡임 ON":"자동 깜빡임 OFF";
    if(autoBlink)scheduleBlink();else{clearTimeout(blinkTimer);blink=false;}
  });
  let demoOn=false,demoTimer,pi=0;
  const PATTERN=[1,2,1,0,2,2,1,0,1,2,0,1,2,1,0,0];
  document.getElementById('btnDemo').addEventListener('click',function(){
    demoOn=!demoOn;this.classList.toggle('on',demoOn);
    this.textContent=demoOn?"💬 데모 토크 중…":"💬 데모 토크";
    if(demoOn){stopMic();(function loop(){mouth=PATTERN[pi++%PATTERN.length];demoTimer=setTimeout(loop,rand(95,150));})();}
    else{clearTimeout(demoTimer);mouth=0;}
  });
  let audioCtx,analyser,micStream,micRAF,buf;
  const micBtn=document.getElementById('btnMic'),micStatus=document.getElementById('micStatus');
  function stopMic(){
    if(micRAF)cancelAnimationFrame(micRAF);
    if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}
    if(audioCtx){audioCtx.close();audioCtx=null;}
    micBtn.classList.remove('on');micBtn.textContent="🎤 마이크";
  }
  micBtn.addEventListener('click',async function(){
    if(micStream){stopMic();micStatus.textContent="";mouth=0;return;}
    try{
      if(demoOn)document.getElementById('btnDemo').click();
      micStream=await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const src=audioCtx.createMediaStreamSource(micStream);
      analyser=audioCtx.createAnalyser();analyser.fftSize=1024;buf=new Float32Array(analyser.fftSize);
      src.connect(analyser);
      micBtn.classList.add('on');micBtn.textContent="🎤 듣는 중…";micStatus.textContent="말해 보세요!";
      (function read(){
        analyser.getFloatTimeDomainData(buf);
        let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
        const rms=Math.sqrt(s/buf.length);
        mouth=rms<0.018?0:(rms<0.055?1:2);
        micRAF=requestAnimationFrame(read);
      })();
    }catch(err){micStatus.textContent="마이크 권한 필요 — 데모 토크를 써 보세요";}
  });
  const sizeEl=document.getElementById('size');
  function applySize(){
    const r=stage.getBoundingClientRect();
    const s=Math.min(parseInt(sizeEl.value,10),Math.floor(r.width-12),Math.floor(r.height-12));
    char.style.width=s+"px";char.style.height=s+"px";
  }
  sizeEl.addEventListener('input',applySize);
  window.addEventListener('resize',applySize);applySize();
  document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',function(){
    document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
    this.classList.add('on');stage.style.background=this.dataset.bg;
  }));
})();
</script>
</body>
</html>
