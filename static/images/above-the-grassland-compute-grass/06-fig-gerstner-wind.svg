<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Noto Sans KR', -apple-system, sans-serif">
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e5016"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a7a9a"/>
    </marker>
    <marker id="arrowRust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b6b3a"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#2e5016">
    바람은 노이즈가 아니라 방향성 유동장이다
  </text>

  <!-- Left: pure noise (what it isn't) -->
  <g transform="translate(60 90)">
    <rect x="0" y="0" width="340" height="340" rx="6" fill="#eeeeee" stroke="#999" stroke-width="1"/>
    <text x="170" y="-6" text-anchor="middle" font-size="12" font-weight="600" fill="#666">가상: 순수 노이즈 필드</text>
    <!-- scatter random arrows -->
    <g stroke="#5a7a9a" stroke-width="1.4">
      <!-- 6x6 grid of chaotic arrows -->
      <line x1="30"  y1="30"  x2="55"  y2="55"  marker-end="url(#arrowSlate)"/>
      <line x1="90"  y1="30"  x2="70"  y2="60"  marker-end="url(#arrowSlate)"/>
      <line x1="150" y1="30"  x2="180" y2="55"  marker-end="url(#arrowSlate)"/>
      <line x1="210" y1="30"  x2="185" y2="15"  marker-end="url(#arrowSlate)"/>
      <line x1="270" y1="30"  x2="295" y2="55"  marker-end="url(#arrowSlate)"/>
      <line x1="30"  y1="90"  x2="60"  y2="75"  marker-end="url(#arrowSlate)"/>
      <line x1="90"  y1="90"  x2="65"  y2="115" marker-end="url(#arrowSlate)"/>
      <line x1="150" y1="90"  x2="175" y2="115" marker-end="url(#arrowSlate)"/>
      <line x1="210" y1="90"  x2="240" y2="75"  marker-end="url(#arrowSlate)"/>
      <line x1="270" y1="90"  x2="255" y2="115" marker-end="url(#arrowSlate)"/>
      <line x1="30"  y1="150" x2="50"  y2="175" marker-end="url(#arrowSlate)"/>
      <line x1="90"  y1="150" x2="115" y2="135" marker-end="url(#arrowSlate)"/>
      <line x1="150" y1="150" x2="130" y2="180" marker-end="url(#arrowSlate)"/>
      <line x1="210" y1="150" x2="240" y2="170" marker-end="url(#arrowSlate)"/>
      <line x1="270" y1="150" x2="255" y2="130" marker-end="url(#arrowSlate)"/>
      <line x1="30"  y1="210" x2="60"  y2="235" marker-end="url(#arrowSlate)"/>
      <line x1="90"  y1="210" x2="75"  y2="190" marker-end="url(#arrowSlate)"/>
      <line x1="150" y1="210" x2="180" y2="195" marker-end="url(#arrowSlate)"/>
      <line x1="210" y1="210" x2="195" y2="235" marker-end="url(#arrowSlate)"/>
      <line x1="270" y1="210" x2="250" y2="185" marker-end="url(#arrowSlate)"/>
      <line x1="30"  y1="270" x2="55"  y2="250" marker-end="url(#arrowSlate)"/>
      <line x1="90"  y1="270" x2="115" y2="295" marker-end="url(#arrowSlate)"/>
      <line x1="150" y1="270" x2="130" y2="250" marker-end="url(#arrowSlate)"/>
      <line x1="210" y1="270" x2="185" y2="290" marker-end="url(#arrowSlate)"/>
      <line x1="270" y1="270" x2="300" y2="255" marker-end="url(#arrowSlate)"/>
    </g>
    <text x="170" y="360" text-anchor="middle" font-size="11" fill="#666" font-style="italic">
      매 픽셀 독립적인 랜덤 방향
    </text>
  </g>

  <!-- Right: directional flow (what it is) -->
  <g transform="translate(560 90)">
    <rect x="0" y="0" width="340" height="340" rx="6" fill="#f6f2e6" stroke="#2e5016" stroke-width="1.5"/>
    <text x="170" y="-6" text-anchor="middle" font-size="12" font-weight="600" fill="#2e5016">Above the Grassland</text>

    <!-- primary wind direction — angle 0.18 rad from vertical, coming from lower-left to upper-right -->
    <!-- but visualize as a "wave" pattern -->
    <!-- Draw a wavy field: rows offset by sin -->
    <g stroke="#2e5016" stroke-width="1.6">
      <!-- 6 rows, 5 cols. Each arrow has base direction ~30° from horizontal (dir=0.18 rad -->
      <!-- pointing bottom-left to top-right), amplitude modulated by sin. -->
      <!-- Row 1 y=30 wave phase 0 -->
      <line x1="30"  y1="45"  x2="60"  y2="15"  marker-end="url(#arrowGreen)"/>
      <line x1="90"  y1="50"  x2="120" y2="22"  marker-end="url(#arrowGreen)"/>
      <line x1="150" y1="42"  x2="180" y2="16"  marker-end="url(#arrowGreen)"/>
      <line x1="210" y1="35"  x2="240" y2="10"  marker-end="url(#arrowGreen)"/>
      <line x1="270" y1="38"  x2="300" y2="14"  marker-end="url(#arrowGreen)"/>

      <line x1="30"  y1="105" x2="60"  y2="75"  marker-end="url(#arrowGreen)"/>
      <line x1="90"  y1="112" x2="120" y2="82"  marker-end="url(#arrowGreen)"/>
      <line x1="150" y1="118" x2="180" y2="90"  marker-end="url(#arrowGreen)"/>
      <line x1="210" y1="112" x2="240" y2="85"  marker-end="url(#arrowGreen)"/>
      <line x1="270" y1="104" x2="300" y2="77"  marker-end="url(#arrowGreen)"/>

      <line x1="30"  y1="165" x2="60"  y2="135" marker-end="url(#arrowGreen)"/>
      <line x1="90"  y1="160" x2="120" y2="130" marker-end="url(#arrowGreen)"/>
      <line x1="150" y1="172" x2="180" y2="144" marker-end="url(#arrowGreen)"/>
      <line x1="210" y1="180" x2="240" y2="152" marker-end="url(#arrowGreen)"/>
      <line x1="270" y1="170" x2="300" y2="142" marker-end="url(#arrowGreen)"/>

      <line x1="30"  y1="225" x2="60"  y2="196" marker-end="url(#arrowGreen)"/>
      <line x1="90"  y1="222" x2="120" y2="192" marker-end="url(#arrowGreen)"/>
      <line x1="150" y1="230" x2="180" y2="203" marker-end="url(#arrowGreen)"/>
      <line x1="210" y1="240" x2="240" y2="213" marker-end="url(#arrowGreen)"/>
      <line x1="270" y1="234" x2="300" y2="207" marker-end="url(#arrowGreen)"/>

      <line x1="30"  y1="285" x2="60"  y2="256" marker-end="url(#arrowGreen)"/>
      <line x1="90"  y1="288" x2="120" y2="260" marker-end="url(#arrowGreen)"/>
      <line x1="150" y1="280" x2="180" y2="252" marker-end="url(#arrowGreen)"/>
      <line x1="210" y1="288" x2="240" y2="262" marker-end="url(#arrowGreen)"/>
      <line x1="270" y1="295" x2="300" y2="266" marker-end="url(#arrowGreen)"/>
    </g>

    <!-- big compass arrow: primary direction -->
    <line x1="45" y1="315" x2="115" y2="255" stroke="#8b6b3a" stroke-width="3" marker-end="url(#arrowRust)"/>
    <text x="118" y="252" font-size="11" fill="#8b6b3a" font-weight="600">wind direction</text>

    <text x="170" y="360" text-anchor="middle" font-size="11" fill="#2e5016" font-style="italic">
      한 방향으로 진행하는 파도 + 미세 turbulence
    </text>
  </g>

  <!-- Formula strip at bottom -->
  <g transform="translate(60 460)">
    <rect x="0" y="0" width="840" height="42" rx="6" fill="#fafafa" stroke="#2e5016" stroke-opacity="0.4"/>
    <text x="20" y="26" font-size="12" font-family="ui-monospace, monospace" fill="#2e5016">
      wind(pos) = s · sin( dot(pos, s) · freq + t · speed ) + s⊥ · turbulence(pos, t)
    </text>
    <text x="720" y="26" font-size="10" fill="#666" font-style="italic">
      s = 방향 단위벡터, t = 시간
    </text>
  </g>
</svg>
