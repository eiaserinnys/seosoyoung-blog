<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Noto Sans KR', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bladeG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2e5016"/>
      <stop offset="100%" stop-color="#8fa43a"/>
    </linearGradient>
  </defs>

  <!-- Ground line -->
  <line x1="60" y1="410" x2="840" y2="410" stroke="#556e3a" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Four blades: near (3), mid (2), far (1), ultra (0=triangle) -->
  <!-- Each blade rendered as taper: at row r (0..1), half-width = 0.5 * (1 - r^2) * bladeWidth -->

  <g id="near" transform="translate(160 410)">
    <text x="0" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#2e5016">near · segments=3</text>
    <text x="0" y="46" text-anchor="middle" font-size="10" fill="#555">파라볼릭 taper</text>
    <text x="0" y="60" text-anchor="middle" font-size="10" fill="#555">8 정점 + 팁</text>

    <!-- polygon: build using r=0,1/3,2/3,3/3 with half-width a=1-r^2 -->
    <!-- height scale 200; half-width scale 70 -->
    <polygon fill="url(#bladeG)" stroke="#2e5016" stroke-width="1"
      points="-70,0 70,0 -62.2,-66.67 62.2,-66.67 -38.9,-133.33 38.9,-133.33 0,-200"/>

    <!-- vertex dots -->
    <g fill="#2e5016">
      <circle cx="-70" cy="0" r="3"/>
      <circle cx="70"  cy="0" r="3"/>
      <circle cx="-62.2" cy="-66.67" r="3"/>
      <circle cx="62.2"  cy="-66.67" r="3"/>
      <circle cx="-38.9" cy="-133.33" r="3"/>
      <circle cx="38.9"  cy="-133.33" r="3"/>
      <circle cx="0" cy="-200" r="3.5"/>
    </g>

    <!-- r labels -->
    <g font-size="9" fill="#666" font-family="ui-monospace, monospace">
      <text x="-92" y="4">r=0</text>
      <text x="-92" y="-63">r=⅓</text>
      <text x="-92" y="-130">r=⅔</text>
      <text x="-92" y="-197">r=1</text>
    </g>
  </g>

  <g id="mid" transform="translate(360 410)">
    <text x="0" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#2e5016">mid · segments=2</text>
    <text x="0" y="46" text-anchor="middle" font-size="10" fill="#555">6 정점 + 팁</text>
    <polygon fill="url(#bladeG)" stroke="#2e5016" stroke-width="1"
      points="-70,0 70,0 -52.5,-100 52.5,-100 0,-200"/>
    <g fill="#2e5016">
      <circle cx="-70" cy="0" r="3"/>
      <circle cx="70" cy="0" r="3"/>
      <circle cx="-52.5" cy="-100" r="3"/>
      <circle cx="52.5"  cy="-100" r="3"/>
      <circle cx="0" cy="-200" r="3.5"/>
    </g>
  </g>

  <g id="far" transform="translate(560 410)">
    <text x="0" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#2e5016">far · segments=1</text>
    <text x="0" y="46" text-anchor="middle" font-size="10" fill="#555">4 정점 + 팁</text>
    <polygon fill="url(#bladeG)" stroke="#2e5016" stroke-width="1"
      points="-70,0 70,0 0,-200"/>
    <g fill="#2e5016">
      <circle cx="-70" cy="0" r="3"/>
      <circle cx="70" cy="0" r="3"/>
      <circle cx="0" cy="-200" r="3.5"/>
    </g>
  </g>

  <g id="ultra" transform="translate(760 410)">
    <text x="0" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#2e5016">ultra · segments=0</text>
    <text x="0" y="46" text-anchor="middle" font-size="10" fill="#555">삼각형 하나</text>
    <polygon fill="url(#bladeG)" stroke="#2e5016" stroke-width="1"
      points="-70,0 70,0 0,-200"/>
    <g fill="#2e5016">
      <circle cx="-70" cy="0" r="3"/>
      <circle cx="70" cy="0" r="3"/>
      <circle cx="0" cy="-200" r="3.5"/>
    </g>
  </g>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#2e5016">
    파라볼릭 taper: half-width = ½ · (1 − r²)
  </text>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#555">
    같은 공식 한 줄이 티어별로 다른 지오메트리를 만든다
  </text>

  <!-- caption -->
  <text x="450" y="465" text-anchor="middle" font-size="11" fill="#555" font-style="italic">
    r ∈ [0,1] 은 밑동→팁. r² 곡선이 팁으로 갈수록 폭을 부드럽게 좁힌다.
  </text>
</svg>
