<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <style>
      .bg { fill: #f8f5ee; }
      .axis { stroke: #4a4035; stroke-width: 1; }
      .gridline { stroke: #c8bfb0; stroke-width: 0.5; stroke-dasharray: 3 3; }
      .label-row { font-size: 14px; fill: #2a2520; font-weight: 500; }
      .label-time { font-size: 12px; fill: #4a4035; }
      .label-verdict { font-size: 12px; fill: #2a2520; font-style: italic; }
      .label-tick { font-size: 11px; fill: #6a5f50; }
      .title { font-size: 17px; fill: #1a1612; font-weight: 600; }
      .subtitle { font-size: 12px; fill: #6a5f50; }
      .bar-partial { fill: #6b8c75; opacity: 0.85; }
      .bar-generation { fill: #b8995e; opacity: 0.75; }
      .bar-broken { fill: #a85555; opacity: 0.7; }
      .bar-cohort { fill: #7a3838; opacity: 0.75; }
    </style>
  </defs>

  <rect class="bg" width="800" height="420"/>

  <text class="title" x="400" y="32" text-anchor="middle">시간 척도의 비대칭</text>
  <text class="subtitle" x="400" y="52" text-anchor="middle">자가교정이 작동하는 시간 단위와, 작동하지 않는 시간 단위</text>

  <!-- x axis tick markers -->
  <line class="gridline" x1="120" y1="80" x2="120" y2="340"/>
  <line class="gridline" x1="240" y1="80" x2="240" y2="340"/>
  <line class="gridline" x1="380" y1="80" x2="380" y2="340"/>
  <line class="gridline" x1="540" y1="80" x2="540" y2="340"/>
  <line class="gridline" x1="720" y1="80" x2="720" y2="340"/>

  <!-- x axis line -->
  <line class="axis" x1="120" y1="340" x2="740" y2="340"/>

  <!-- x tick labels -->
  <text class="label-tick" x="120" y="362" text-anchor="middle">0</text>
  <text class="label-tick" x="240" y="362" text-anchor="middle">18개월</text>
  <text class="label-tick" x="380" y="362" text-anchor="middle">5~10년</text>
  <text class="label-tick" x="540" y="362" text-anchor="middle">한 세대</text>
  <text class="label-tick" x="720" y="362" text-anchor="middle">30년+</text>

  <!-- Row 1: 회사 차원 -->
  <text class="label-row" x="110" y="108" text-anchor="end">회사 차원</text>
  <rect class="bar-partial" x="120" y="92" width="125" height="28" rx="2"/>
  <text class="label-time" x="252" y="110">18개월</text>
  <text class="label-verdict" x="600" y="110" text-anchor="middle">부분 작동</text>

  <!-- Row 2: 시장 차원 -->
  <text class="label-row" x="110" y="168" text-anchor="end">시장 차원</text>
  <rect class="bar-generation" x="120" y="152" width="450" height="28" rx="2"/>
  <text class="label-time" x="578" y="170">29~35년</text>
  <text class="label-verdict" x="600" y="200" text-anchor="middle">한 세대 단위로만 작동</text>

  <!-- Row 3: 개인 인지 차원 -->
  <text class="label-row" x="110" y="248" text-anchor="end">개인 인지 차원</text>
  <rect class="bar-broken" x="120" y="232" width="200" height="28" rx="2"/>
  <text class="label-time" x="328" y="250">5~10년</text>
  <text class="label-verdict" x="600" y="250" text-anchor="middle">작동 안 함</text>

  <!-- Row 4: 코호트 차원 -->
  <text class="label-row" x="110" y="308" text-anchor="end">코호트 차원</text>
  <rect class="bar-cohort" x="120" y="292" width="540" height="28" rx="2"/>
  <text class="label-time" x="668" y="310">한 세대</text>
  <text class="label-verdict" x="600" y="338" text-anchor="middle">작동 안 함</text>

  <!-- caption -->
  <text class="subtitle" x="400" y="395" text-anchor="middle">막대 길이 = 자가교정이 작동하기까지 걸리는 시간</text>
  <text class="subtitle" x="400" y="410" text-anchor="middle">회사 18개월에 부분 정정이 시작될 때, 코호트는 이미 한 세대의 형태를 입은 뒤이다</text>
</svg>
