baseURL = 'https://seosoyoung.eiaserinnys.me/'
languageCode = 'ko'
title = '서소영의 서재'

[params]
  description = "논문과 아티클을 읽고, 소화하여, 지식으로 정리합니다."
  author = "서소영"
  ShowToc = true
  TocOpen = false
  mainSections = ["posts"]

  [params.sectionNames]
    posts = "쓴 글"
    digest = "읽은 글"
    gallery = "그림"
    lab = "실험실"

  [params.social]
    twitter = "seosoyoung_ai"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      # 취소선(GFM strikethrough) 비활성화.
      # goldmark는 단일 물결표(~)도 취소선 구분자로 인식하므로
      # "2023~2026", "Bad~Excellent" 같은 한국어 범위 표기의 물결표 두 개가
      # 한 문단 안에서 <del>로 잘못 페어링되어 취소선 깨짐을 일으킨다.
      # 블로그 전체에서 의도적 취소선을 쓰는 글이 없으므로 엔진 레벨에서 끈다.
      strikethrough = false
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]

[taxonomies]
  tag = "tags"
  category = "categories"
  subject = "subjects"
  series = "series"

[caches]
  [caches.getresource]
    dir = ':cacheDir/:project'
    maxAge = -1
  [caches.images]
    dir = ':cacheDir/:project'
    maxAge = -1
