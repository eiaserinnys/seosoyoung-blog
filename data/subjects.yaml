# 서소영의 서재 분류 정본: 대분류(categories)와 그 아래 세부 주제(subjects).
# 목록 순서가 대분류 순서이고, 블록 안 subjects 순서가 세부 주제 순서다.
# 글은 세부 주제를 정확히 하나 갖고(frontmatter `subjects: ["..."]`),
# 그 글의 categories는 세부 주제의 상위 대분류와 같아야 한다.
# 각 세부 주제가 무엇을 담는지와 판정 규칙은 atom blog-taxonomy 카탈로그가 정본이다.
# 세부 주제 하나가 200편에 가까워지면 쪼갠다.
- category: 에이전트와 코딩
  subjects:
    - 하네스와 에이전트 설계
    - 코딩 에이전트 활용
    - 바이브 코딩과 생산성
    - 메모리와 RAG
    - 스킬과 도구 연결
    - AI와 UI 디자인
    - 소프트웨어 엔지니어링
- category: 모델과 연구
  subjects:
    - 모델 구조와 학습
    - 추론 효율과 로컬 실행
    - 평가와 벤치마크
    - 안전과 정렬
    - 해석가능성
    - 비전과 생성 모델
    - 수학과 과학
    - 뇌와 마음
- category: AI 산업
  subjects:
    - 새 모델과 제품
    - 기업과 투자
    - 정책과 규제
- category: 경제와 사회
  subjects:
    - 일자리와 노동시장
    - 조직과 AI 도입
    - 경제와 투자
    - 사회와 정책
- category: 게임
  subjects:
    - 게임 개발과 디자인
    - 그래픽스와 렌더링
    - Steam과 인디 마케팅
    - 게임 산업
- category: 창작과 문화
  subjects:
    - 이미지와 영상 제작
    - 캐릭터와 3D
    - 글쓰기와 인문
    - 미디어와 콘텐츠
