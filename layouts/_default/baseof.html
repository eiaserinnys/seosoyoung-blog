<!doctype html>
<html lang="ko">
<head>
  {{ partial "head.html" . }}
  {{ block "head" . }}{{ end }}
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-top">
    <div class="wrap">{{ partial "topbar.html" . }}</div>
  </header>
  <div class="wrap">
    <main id="main">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
  {{- $script := resources.Get "js/site.js" | js.Build (dict "minify" true) | fingerprint -}}
  <script defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" crossorigin="anonymous"></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
