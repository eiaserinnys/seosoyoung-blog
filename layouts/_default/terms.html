{{ define "main" }}
  {{- partial "page-head.html" (dict "title" .Title "stats" (slice (dict "label" "항목" "value" (len .Data.Terms)))) -}}
  <div class="term-list">
    {{- range .Data.Terms.ByCount }}
      <a href="{{ .Page.RelPermalink }}"><span>{{ .Page.Title }}</span><span class="mono">{{ .Count }}</span></a>
    {{- end }}
  </div>
{{ end }}
