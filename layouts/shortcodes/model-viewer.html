<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<model-viewer
  src="{{ .Get "src" }}"
  alt="{{ .Get "alt" }}"
  auto-rotate
  camera-controls
  touch-action="pan-y"
  shadow-intensity="0.5"
  exposure="2.0"
  style="width: 100%; height: 500px; background-color: {{ .Get "bg" | default "var(--bg-2)" }}; border-radius: var(--zero);"
></model-viewer>
