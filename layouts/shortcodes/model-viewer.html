<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<model-viewer
  src="{{ .Get "src" }}"
  alt="{{ .Get "alt" }}"
  auto-rotate
  camera-controls
  touch-action="pan-y"
  shadow-intensity="0.3"
  exposure="1.8"
  environment-image="neutral"
  style="width: 100%; height: 500px; background-color: {{ .Get "bg" | default "#e8eef5" }}; border-radius: 8px;"
></model-viewer>
