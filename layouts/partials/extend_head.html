<style>
  .first-entry {
    min-height: unset;
  }
  .about-portrait img {
    width: 100%;
    max-width: 720px;
    border-radius: 12px;
    margin: 0 0 2rem 0;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
  }
  .about-scene img {
    width: 100%;
    max-width: 720px;
    border-radius: 12px;
    margin: 1.5rem 0;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
  }

{{- if eq .Section "gallery" }}
<style>
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
    margin: 1.5rem 0;
  }
  .gallery-grid .gallery-cell {
    display: block;
    overflow: hidden;
    border-radius: 6px;
    background: var(--code-bg);
  }
  .gallery-grid .gallery-cell img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    transition: transform .25s ease;
  }
  .gallery-grid .gallery-cell:hover img {
    transform: scale(1.04);
  }
</style>
{{- end }}
{{ if .Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\\\(', right: '\\\\)', display: false},
      {left: '\\\\[', right: '\\\\]', display: true}
    ],
    throwOnError: false
  });"></script>
{{ end }}
{{- if and .IsPage .Params.sidenotes }}
<style>
  @media (min-width: 1200px) {
    .main.has-sidenotes {
      max-width: calc(720px + 40px + 280px + var(--gap) * 2);
    }

    article.post-single.has-sidenotes {
      position: relative;
      width: 100%;
      max-width: 720px;
      min-height: var(--sidenotes-height, 0);
    }

    article.post-single.has-sidenotes .footnotes {
      display: none;
    }

    article.post-single.has-sidenotes .sidenote {
      position: absolute;
      left: calc(100% + 40px);
      width: 280px;
      box-sizing: border-box;
      padding-inline-start: 16px;
      border-inline-start: 1px solid var(--border);
      color: var(--secondary);
      font-size: 0.82rem;
      line-height: 1.55;
    }

    article.post-single.has-sidenotes .sidenote p {
      margin: 0 0 0.65rem;
    }

    article.post-single.has-sidenotes .sidenote p:last-child {
      margin-bottom: 0;
    }

    article.post-single.has-sidenotes .sidenote a {
      color: var(--primary);
      box-shadow: none;
    }
  }

  @media (max-width: 1199px) {
    aside.sidenote {
      display: none;
    }
  }
</style>
<script>
  (function () {
    var desktopQuery = window.matchMedia('(min-width: 1200px)');
    var overlapGap = 12;
    var resizeTimer = 0;

    function normalizeFootnoteKey(value) {
      if (!value) return '';
      var key = String(value).trim();
      if (key.charAt(0) === '#') key = key.slice(1);
      try {
        key = decodeURIComponent(key);
      } catch (error) {
        // Keep the raw key when the browser gives an already-decoded fragment.
      }
      return key
        .replace(/^fnref[:\-]/, '')
        .replace(/^fn[:\-]/, '');
    }

    function markerKey(marker) {
      var idKey = normalizeFootnoteKey(marker.id);
      if (idKey) return idKey;
      var link = marker.matches('a[href^="#fn"]')
        ? marker
        : marker.querySelector('a[href^="#fn"]');
      return link ? normalizeFootnoteKey(link.getAttribute('href')) : '';
    }

    function removeSidenotes(article) {
      article.querySelectorAll('aside.sidenote').forEach(function (note) {
        note.remove();
      });
      article.classList.remove('has-sidenotes');
      article.style.removeProperty('--sidenotes-height');
      var main = article.closest('.main');
      if (main) main.classList.remove('has-sidenotes');
    }

    function collectMarkers(article) {
      var markers = Array.prototype.slice.call(
        article.querySelectorAll('.post-content sup[id^="fnref"]')
      );
      if (markers.length) return markers;
      return Array.prototype.slice.call(
        article.querySelectorAll('.post-content a.footnote-ref[href^="#fn"]')
      );
    }

    function noteByKey(footnoteList) {
      var notes = new Map();
      Array.prototype.slice.call(footnoteList.children).forEach(function (item) {
        var key = normalizeFootnoteKey(item.id);
        if (key) notes.set(key, item);
      });
      return notes;
    }

    function pruneBackrefs(note) {
      note.querySelectorAll('.footnote-backref, a[role="doc-backlink"]').forEach(function (link) {
        link.remove();
      });
    }

    function layoutArticle(article) {
      removeSidenotes(article);
      if (!desktopQuery.matches) return;

      var footnoteList = article.querySelector('.footnotes > ol');
      if (!footnoteList || !footnoteList.children.length) return;

      var markers = collectMarkers(article);
      if (!markers.length) return;

      var notes = noteByKey(footnoteList);
      article.classList.add('has-sidenotes');
      var main = article.closest('.main');
      if (main) main.classList.add('has-sidenotes');
      // Reflow after widening the main column so marker coordinates use final layout.
      article.offsetWidth;

      var articleTop = article.getBoundingClientRect().top + window.scrollY;
      var lastBottom = 0;
      var created = 0;

      markers.forEach(function (marker) {
        var key = markerKey(marker);
        var source = notes.get(key);
        if (!source) return;

        var sidenote = document.createElement('aside');
        sidenote.className = 'sidenote';
        sidenote.setAttribute('role', 'note');
        sidenote.dataset.footnoteKey = key;
        sidenote.innerHTML = source.innerHTML;
        pruneBackrefs(sidenote);
        article.appendChild(sidenote);

        var markerTop = marker.getBoundingClientRect().top + window.scrollY - articleTop;
        var top = Math.max(markerTop, lastBottom + overlapGap);
        sidenote.style.top = Math.round(top) + 'px';
        lastBottom = top + sidenote.offsetHeight;
        created += 1;
      });

      if (!created) {
        removeSidenotes(article);
        return;
      }

      article.style.setProperty('--sidenotes-height', Math.ceil(lastBottom) + 'px');
    }

    function layoutSidenotes() {
      document.querySelectorAll('article.post-single').forEach(layoutArticle);
    }

    function scheduleLayout(delay) {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(layoutSidenotes, delay == null ? 120 : delay);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', layoutSidenotes);
    } else {
      layoutSidenotes();
    }
    window.addEventListener('load', function () {
      layoutSidenotes();
      scheduleLayout(800);
    });
    window.addEventListener('resize', function () {
      scheduleLayout(120);
    });
    if (desktopQuery.addEventListener) {
      desktopQuery.addEventListener('change', layoutSidenotes);
    } else if (desktopQuery.addListener) {
      desktopQuery.addListener(layoutSidenotes);
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(layoutSidenotes).catch(function () {});
    }
    // 안전망: 이미지·폰트·표 등이 늦게 자리잡으며 sup 위치가 변할 때 sidenote를 다시 배치한다.
    // load+800ms 트리거만으로는 느린 이미지 응답·동적 콘텐츠를 못 따라잡는다.
    if ('ResizeObserver' in window) {
      var ro = new ResizeObserver(function () { scheduleLayout(120); });
      document.querySelectorAll('article.post-single').forEach(function (article) {
        ro.observe(article);
      });
    }
  })();
</script>
{{- end }}

{{- if .IsPage }}
{{/* 본문 이미지 라이트박스 — 클릭하면 어두운 오버레이에 원본 크기로 확대, 캡션 병기. 링크로 감싼 이미지는 원래 동작 유지. */}}
<style>
  .post-content img { cursor: zoom-in; }
  .ssy-lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(12, 12, 14, .93); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3vh 3vw; cursor: zoom-out; }
  .ssy-lightbox img { max-width: 96vw; max-height: 88vh; object-fit: contain; border-radius: 6px; box-shadow: 0 8px 40px rgba(0, 0, 0, .5); cursor: zoom-out; }
  .ssy-lightbox .ssy-lightbox-caption { color: #c9cdd3; font-size: 13px; line-height: 1.6; margin-top: 14px; max-width: 820px; text-align: center; }
</style>
<script>
  (function () {
    function openLightbox(img) {
      var overlay = document.createElement('div');
      overlay.className = 'ssy-lightbox';
      var big = document.createElement('img');
      big.src = img.currentSrc || img.src;
      big.alt = img.alt || '';
      overlay.appendChild(big);
      var fig = img.closest('figure');
      var cap = fig && fig.querySelector('figcaption');
      var text = (cap && cap.textContent.trim()) || img.alt;
      if (text) {
        var capEl = document.createElement('div');
        capEl.className = 'ssy-lightbox-caption';
        capEl.textContent = text;
        overlay.appendChild(capEl);
      }
      function close() {
        overlay.remove();
        document.removeEventListener('keydown', onKey);
        document.body.style.overflow = '';
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      overlay.addEventListener('click', close);
      document.addEventListener('keydown', onKey);
      document.body.style.overflow = 'hidden';
      document.body.appendChild(overlay);
    }
    document.addEventListener('click', function (e) {
      var img = e.target.closest('.post-content img');
      if (!img) return;
      if (img.closest('a')) return;
      openLightbox(img);
    });
  })();
</script>
{{- end }}
